<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Team Sort</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">        <link rel="stylesheet" href="cssFiles/styles.css" />
        <link rel="stylesheet" href="cssFiles/teamSort.css">
    </head>
    <body>
        <nav class = "nav">
            <div>
                <a href="/">Home Page</a>
                <a href="/scouting">Scouting</a>
                <a href="/teamSort" aria-current="page">Team Sorting</a>
            </div>
        </nav>  
        <h1 id="main-title">Team Sort Page</h1>
        <div class="card">
            <div class="search-container">
                <input
                    type="text"
                    id="teamSearch"
                    placeholder="Search team by name or number..."
                /> 
            </div>
            <div class="container2"> 
                <div class="container-row1">
                    <div class="table-cell">Team Name</div>
                    <div class="table-cell">Team Number</div>
                </div>

                <div id="teamRows"></div>
                <div class="row">
                    <div id="pager" class="pager"></div>
                    <div id="meta" class="meta"></div>
                </div>
            </div>
        </div>
        <script>
            const teamSearch = document.getElementById("teamSearch")


            // Pagination Globals
            let parsedData = [];
            let filteredData = null;
            let page = 1;
            let pageSize = 5;
            let totalPages = 1;

            const pager = document.getElementById('pager');
            const meta = document.getElementById('meta');

            //Load Teams
            function loadTeam_Data() {
            fetch('/api/team_data')
                .then(res => res.json())
                .then(teams => {
                    
                parsedData = teams;
                filteredData = null;

                page = 1;
                totalPages = Math.ceil(parsedData.length / pageSize);

                renderTeams(getPageRows()); 
                renderPager();
                renderMeta();
                });
            }

            //render team_data rows
            function renderTeams(data) {
                const container = document.getElementById('teamRows');

                if (!data.length) {
                    container.innerHTML = '<p>No teams found.</p>';
                    return;
                }
                let html = '';

                data.forEach(team => {
                    html += `
                    <div class="container-row" data-id="${team.id}">
                        <div class="table-cell">${team.teamName}</div
                        <div class="table-cell">${team.teamNumber}</div>
                        <a href="/team-details.html?id=${team.id}">
                            <button class="btn button">View</button>
                        </a>
                    </div>
                    `;
                });

                container.innerHTML = html;
            }

            //Pagination
            function getPageRows() {
                let dataSrc;

                if (filteredData != null) {
                    dataSrc = filteredData
                } else {
                    dataSrc = parsedData
                }

                const start = (page - 1) * pageSize;
                const end = start + pageSize;
                return dataSrc.slice(start, end);
                }

                function renderPager() {
                if (totalPages <= 1) {
                    pager.innerHTML = "";
                    return;
                }

                let parts = [];

                parts.push(link("<<", 1, page === 1));
                parts.push(link("<", page - 1, page === 1));

                for (let p = 1; p <= totalPages; p++) {
                    parts.push(link(String(p), p, false, p === page));
                }

                parts.push(link(">", page + 1, page === totalPages));
                parts.push(link(">>", totalPages, page === totalPages));

                pager.innerHTML = parts.join(" ");

                document.querySelectorAll('#pager a[data-page]').forEach(a => {
                    a.addEventListener('click', e => {
                    e.preventDefault();
                    page = Number(a.dataset.page);

                    renderTeams(getPageRows());
                    renderPager();
                    renderMeta();
                    });
                });
            }

            function renderMeta() {
                const startRow = parsedData.length === 0 ? 0 : ((page - 1) * pageSize) + 1;
                const endRow = Math.min(page * pageSize, parsedData.length);

                meta.textContent = `Showing ${startRow}-${endRow} of ${parsedData.length}`;
            }

            // Pager Helpers
            function link(text, pageNum, disabled = false, active = false) {
                if (disabled) return `<span class="disabled">${text}</span>`;
                if (active) return `<span class="active">${text}</span>`;
                return `<a href="#" data-page="${pageNum}">${text}</a>`;
            }

            //Search Feature
            teamSearch.addEventListener("input", function() {
                const searchQuery = teamSearch.value.toLowerCase().trim();
                
                if (searchQuery === "") {
                    // search cleared
                    filteredData = null;
                    totalPages = Math.ceil(parsedData.length / pageSize);
                } else {
                    filteredData = parsedData.filter(team =>
                    team.teamName.toLowerCase().includes(searchQuery) ||
                    team.teamNumber.toLowerCase().includes(searchQuery)
                    );

                    totalPages = Math.ceil(filteredData.length / pageSize);
                }

                page = 1

                renderTeams(getPageRows());
                renderPager();
                renderMeta();
            })

            loadTeam_Data();
        </script>
    </body>
</html>
