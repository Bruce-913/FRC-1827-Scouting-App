# fly.toml app configuration file generated for team1827-scouting on 2026-04-03T02:03:16-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'team1827-scouting'
primary_region = 'ord'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[[mounts]]
  source = 'myapp_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
